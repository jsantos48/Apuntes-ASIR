services:
  kea-dhcp:
    image: shourai/kea-dhcp
    container_name: kea-dhcp
    restart: unless-stopped
    environment:
      - DHCP4_SERVER=true
      - DHCP6_SERVER=false
    volumes:
      - ./kea-dhcp4.conf:/etc/kea/kea-dhcp4.conf:ro
    networks:
      kea-internal:
        ipv4_address: 172.30.0.10

networks:
  kea-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
