{
"Dhcp4": {
"interfaces-config": {
"interfaces": [ "*" ]
},
"control-socket": {
"socket-type": "unix",
"socket-name": "/run/kea/kea4-ctrl-socket"
},
"lease-database": {
"type": "memfile",
"persist": true,
"name": "/var/lib/kea/dhcp4.leases",
"lfc-interval": 3600
},
"valid-lifetime": 28800,
"max-valid-lifetime": 43200,
"option-data": [
{
"name": "domain-name-servers",
"data": "8.8.8.8, 1.1.1.1"
}
],
"subnet4": [
{
"id": 1,
"subnet": "172.30.0.0/24",
"pools": [
{ "pool": "172.30.0.100 - 172.30.0.200" }
],
"option-data": [
{
"name": "routers",
"data": "172.30.0.1"
},
{
"name": "domain-name",
"data": "aula.local"
}
]
}
],
"loggers": [
{
"name": "kea-dhcp4",
"output_options": [
{
"output": "/var/log/kea/kea-dhcp4.log",
"maxver": 10
}
],
"severity": "INFO"
}
]
}
}
