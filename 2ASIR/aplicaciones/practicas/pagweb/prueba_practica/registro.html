<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
</head>
<body>
     <h1></h1>
    <form>
        <label for="nombre">Nombre del equipo:</label>
        <input type="text" id="nombre" name="nombre" required minlength="4" maxlength="15" title="El nombre del equipo debe tener entre 4 y 15 caracteres y solo puede contener letras y números y guiones." pattern="^[a-zA-Z0-9-]+$">
        <br><br>

        <label for="ip">Dirección IP:</label>
        <input type="text" id="ip" name="ip" required pattern="^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5|2[0-4][0-9]|[01]?[0-9][0-9]?)$">
        <br><br>

        <label for="so">Sistema Operativo:</label><br>
	    <select id="so" name="so" required>
            <option value="" selected>Seleccione un sistema operativo</option>
            <option value="windows">Windows</option>
            <option value="macos">MacOS</option>
            <option value="linux">Linux</option>
        </select>
        <br><br>

        <label for="puerto">Puerto:</label>
        <input type="number" id="puerto" name="puerto" required min="1" max="65535">
        <br><br>

        <label for="correo">Correo del técnico responsable:</label>
        <input type="email" id="correo" name="correo" required title="Campo de tipo email obligatorio. Debe terminar obligatoriamente en el dominio @iesasir.es." pattern="[a-zA-Z0-9._%+-]+@iesasir\.es$">
</body>
</html>
