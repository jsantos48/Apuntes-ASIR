<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suscripción a revista online de cine</title>
</head>
<body>
    <h1>Suscripción a revista online de cine</h1>
    <form>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required maxlength="25">
        <br><br>

        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" name="apellido" required maxlength="50">
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$">
        <br><br>

        <label for="tlf">Teléfono:</label>
        <input type="tel" id="tlf" name="tlf" required pattern="[0-9]{3} [0-9]{2} [0-9]{2}" placeholder="xxx xx xx" maxlength="9">
        <br><br>

        <label for="fecha_nacimiento">Fecha de nacimiento:</label>
        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
        <br><br>

        <label for="sexo">Sexo:</label>
        <select id="sexo" name="sexo" required>
            <option value="masculino">Masculino</option>
            <option value="femenino">Femenino</option>
        </select>
        <br><br>

        <label for="direccion">Dirección:</label>
        <input type="text" id="direccion" name="direccion" required maxlength="75">
        <br><br>

        <label for="ciudad">Ciudad:</label>
        <input type="text" id="ciudad" name="ciudad" required maxlength="25">
        <br><br>

        <label for="codigo_postal">Código postal:</label>
        <input type="text" id="codigo_postal" name="codigo_postal" required pattern="[0-9]{5}" placeholder="xxxxx" maxlength="5">
        <br><br>

        <label for="pais">País:</label>
        <input type="text" id="pais" name="pais" required maxlength="25">
        <br><br>

        <label for="suscripcion">Tipo de suscripción:</label>
        <select id="suscripcion" name="suscripcion" required>
            <option value="mensual">Mensual</option>
            <option value="trimestral">Trimestral</option>
            <option value="anual">Anual</option>
        </select>
        <br><br>

        <label for="metodo_pago">Método de pago:</label>
        <select id="metodo_pago" name="metodo_pago" required>
            <option value="tarjeta_credito">Tarjeta de crédito</option>
            <option value="paypal">PayPal</option>
            <option value="transferencia_bancaria">Transferencia bancaria</option>
        </select>
        <br><br>

        <label for="cuenta_bancaria">Número de cuenta bancaria:</label>
        <input type="text" id="cuenta_bancaria" name="cuenta_bancaria" required maxlength="24" pattern="^ES[0-9]{22}$" title="El número de cuenta bancaria solo puede contener números." placeholder="ESxxxxxxxxxxxxxxxxxxxx">
        <br><br>
        <br></br>

        <label for="nombre_usuario">Nombre de usuario:</label>
        <input type="text" id="nombre_usuario" name="nombre_usuario" required maxlength="15" pattern="[a-zA-Z0-9]+" title="El nombre de usuario solo puede contener letras y números.">
        <br><br>

        <label for="contrasena">Contraseña:</label>
        <input type="password" id="contrasena" name="contrasena" required pattern="(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z]).{8,}" title="La contraseña debe tener al menos 8 caracteres, incluyendo al menos un número, una letra mayúscula y una letra minúscula." minlength="8">
        <br><br>

        <label for="repetir_contrasena">Repetir contraseña:</label>
        <input type="password" id="repetir_contrasena" name="repetir_contrasena" required pattern="(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z]).{8,}" title="La contraseña debe tener al menos 8 caracteres, incluyendo al menos un número, una letra mayúscula y una letra minúscula." minlength="8">
        <br><br>

        <input type="submit" value="Suscribirse">
    </form>
    <script src="validacion_formulario.js"></script>
</body>
</html>
